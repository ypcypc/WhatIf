appId: com.whatif.app
productName: WhatIf
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
extraResources:
  - from: ../backend/dist/whatif-server
    to: sidecar/whatif-server
win:
  target: [nsis]
  icon: build/icon.ico
mac:
  target: [dmg]
  icon: build/icon.icns
linux:
  target: [AppImage, deb]
  icon: build/icon.png
nsis:
  oneClick: true
  allowToChangeInstallationDirectory: false
